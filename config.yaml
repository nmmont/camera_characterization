# camera_characterization/config.yaml

# Global project settings
project:
  camera_name: "Google Pixel 9"
  output_dir: "./outputs"
  figures_dir: "./outputs/figures"

# 1. Geometry & Lens Distortion Calibration Parameters
geometry:
  input_dir: "./images/checkerboard"
  file_extension: ".dng"
  jpg_extension: ".jpg"
  focal_35mm_fallback: 25.0
  checkerboard:
    rows: 6                  # Number of INNER intersection rows
    cols: 9                  # Number of INNER intersection columns
    square_size_mm: 19.0     # Physical length of a square edge in millimeters

# 2. Poisson-Gaussian Sensor Noise Model Parameters
noise:
  flat_field_dir: "./images/flat_fields"
  dark_field_dir: "./images/dark_frames"
  file_extension: ".dng"
  patch_box:
    ymin: 1472               # Central patch bounding box coordinates
    xmin: 1976
    ymax: 1600
    xmax: 2104

# 3. Spatial Resolution (MTF Slanted-Edge) Parameters
resolution:
  input_dir: "./images/slanted_edge"
  file_extension: ".dng"
  # 5 Slanted-Edge ROIs: 1 Center + 4 Corners (pixel coordinates {y, x, h, w})
  rois:
    center:       {y: 700,  x: 390,  h: 400, w: 200}
    top_left:     {y: 100,  x: 100,  h: 400, w: 200}
    top_right:    {y: 100,  x: 3400, h: 400, w: 200}
    bottom_left:  {y: 2500, x: 100,  h: 400, w: 200}
    bottom_right: {y: 2500, x: 3400, h: 400, w: 200}

# 4. Color Science & Accuracy Calibration Parameters
color:
  input_dir: "./images/color_checker"
  file_extension: ".dng"
  white_sheet_file: "./images/flat_fields/led_white.dng"
  bboxes:
    incan_1.dng:     [500, 1515, 395, 1070]
    incan_2.dng:     [550, 1500, 320, 980]
    incan_3.dng:     [500, 1600, 380, 1075]
    incan_white.dng: [153, 1382, 204, 1836]
    led_1.dng:       [480, 1500, 400, 1100]
    led_2.dng:       [500, 1520, 380, 1100]
    led_3.dng:       [490, 1610, 410, 1190]
    led_white.dng:   [153, 1382, 204, 1836]
    oh_1.dng:        [395, 1515, 395, 1120]
    oh_2.dng:        [390, 1620, 365, 1200]
    oh_3.dng:        [420, 1660, 370, 1190]
    oh_white.dng:    [153, 1382, 204, 1836]
    out_1.dng:       [490, 1515, 395, 1075]
    out_2.dng:       [600, 1600, 410, 1075]
    out_3.dng:       [530, 1540, 415, 1080]
    out_white.dng:   [153, 1382, 204, 1836]
